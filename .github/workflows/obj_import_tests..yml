name: Group 5 OBJ Import Tests

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  obj-import-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3

      - name: Build Blender
        run: |
          make update
          make -j$(nproc)

      - name: Run tests
        run: |
          ctest --output-on-failure
