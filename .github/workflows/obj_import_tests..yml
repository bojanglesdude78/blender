name: Group 5 OBJ Import Tests

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  obj-import-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Blender
        run: |
          sudo snap install blender --classic

      - name: Run OBJ Import Test Suite
        run: |
          cd blender
          make test
